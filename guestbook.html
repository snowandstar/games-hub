<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · games-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt); min-height: 100vh;
}
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 218px; flex-shrink: 0; display: flex; flex-direction: column; gap: 26px;
  padding: 22px 16px 20px; background: rgba(10,8,30,.85); backdrop-filter: blur(14px);
  border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: 1px; padding: 0 6px; }
.logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.snav { display: flex; flex-direction: column; gap: 8px; }
.mnav {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; color: var(--sub);
  padding: 11px 14px; border-radius: 12px; font-size: 14px; cursor: pointer; text-decoration: none; transition: .15s;
}
.mnav svg { width: 18px; height: 18px; flex-shrink: 0; }
.mnav:hover { color: var(--txt); background: rgba(255,255,255,.06); border-color: var(--line); }
.mnav.on { background: linear-gradient(135deg, rgba(165,180,252,.22), rgba(124,58,237,.16)); color: var(--accent); border-color: rgba(165,180,252,.4); font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 11.5px; color: #5b6287; line-height: 1.7; }
.main { flex: 1; min-width: 0; }
.container { max-width: 860px; margin: 0 auto; padding: 26px 22px 44px; }
.page-head { margin-bottom: 18px; }
.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.page-head p { color: var(--dim); font-size: 13px; margin-top: 6px; }
.form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 22px; }
.form input[type=text], .form textarea {
  width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--line); color: var(--txt);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
}
.form input[type=text] { max-width: 280px; margin-bottom: 10px; }
.form textarea { min-height: 90px; resize: vertical; }
.form input:focus, .form textarea:focus { border-color: var(--accent2); }
.form .btn {
  border: 0; cursor: pointer; border-radius: 10px; background: var(--accent); color: #1e1b4b;
  font-size: 14px; font-weight: 700; padding: 10px 28px; margin-top: 12px;
}
.form .btn:hover { background: #dbe3ff; }
.form .btn:disabled { opacity: .5; cursor: wait; }
.msg-row { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.msg-row:last-child { border-bottom: 0; }
.avatar {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;
  background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
}
.msg-body { flex: 1; min-width: 0; }
.msg-body .meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.msg-body .name { font-weight: 700; font-size: 14px; }
.msg-body .time { color: var(--dim); font-size: 12px; }
.msg-body .text { font-size: 14px; line-height: 1.6; color: var(--sub); word-break: break-word; white-space: pre-wrap; }
.state { text-align: center; padding: 50px 20px; color: var(--dim); font-size: 14px; }
.state button {
  margin-top: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.08);
  color: var(--txt); padding: 8px 22px; border-radius: 10px; cursor: pointer; font-size: 14px;
}
.auth-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px;
}
.auth-banner .ab-txt { font-size: 13.5px; color: var(--sub); }
.auth-banner .ab-txt b { color: var(--accent); }
.auth-banner a, .auth-banner button {
  border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--txt);
  padding: 7px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; text-decoration: none;
}
.auth-banner button:hover, .auth-banner a:hover { border-color: var(--accent2); color: var(--accent); }
.del-btn {
  border: 1px solid transparent; background: transparent; color: var(--dim); cursor: pointer;
  font-size: 11.5px; padding: 2px 8px; border-radius: 8px; margin-left: 4px;
}
.del-btn:hover { color: #fca5a5; border-color: rgba(252,165,165,.35); background: rgba(252,165,165,.08); }
@media (max-width: 820px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .sidebar-foot { display: none; }
  .snav { flex-direction: row; }
  .mnav { padding: 9px 12px; }
}
::selection { background: rgba(165,180,252,.35); color: #fff; }
* { scrollbar-width: thin; scrollbar-color: rgba(165,180,252,.35) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: rgba(165,180,252,.3); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#302b63"/><path d="M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/></svg>
      games-hub
    </div>
    <nav class="snav">
      <a class="mnav" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M9 13h.01M15 10h.01M18 13h.01"/></svg>
        游戏中心
      </a>
      <a class="mnav" href="/#ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>
        AI 助手
      </a>
      <a class="mnav" href="/tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        工具箱
      </a>
      <a class="mnav" href="/media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        影视音乐
      </a>
      <a class="mnav on" href="/guestbook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        留言板
      </a>
    </nav>
    <div class="sidebar-foot">Cloudflare Pages 免费托管</div>
  </aside>
  <main class="main">
    <div class="container">
      <div class="page-head">
        <h1>留言板</h1>
        <p>留下你想说的话，数据存储在 Cloudflare KV（免费额度）</p>
      </div>
      <div class="auth-banner" id="authBanner">
        <div class="ab-txt" id="abTxt">…</div>
        <a href="/#login" id="abBtn">去登录</a>
      </div>
      <div class="form">
        <div class="ab-txt" id="formName" style="margin-bottom:10px;font-size:13px;color:var(--accent)"></div>
        <textarea id="inText" placeholder="说点什么…（最多 500 字）" maxlength="500"></textarea>
        <button class="btn" id="sendBtn">发布留言</button>
      </div>
      <div id="list"></div>
      <div class="state" id="state" style="display:none"></div>
    </div>
  </main>
</div>

<script>
const listEl = document.getElementById("list");
const stateEl = document.getElementById("state");
const sendBtn = document.getElementById("sendBtn");
const authBanner = document.getElementById("authBanner");
const abTxt = document.getElementById("abTxt");
const abBtn = document.getElementById("abBtn");
const formName = document.getElementById("formName");

// 与首页共享登录状态（localStorage）
function getToken() { return localStorage.getItem("ghub_token") || ""; }
function getUser() { try { return JSON.parse(localStorage.getItem("ghub_user") || "null"); } catch (e) { return null; } }
let me = getUser();
function updateAuthUI() {
  if (me && me.username) {
    authBanner.style.display = "none";
    formName.textContent = "以 " + me.username + (me.admin ? "（管理员）" : "") + " 的身份留言";
    sendBtn.disabled = false;
  } else {
    authBanner.style.display = "flex";
    abTxt.innerHTML = "登录后才能留言，游客可以查看留言。";
    abBtn.style.display = "";
    formName.textContent = "";
    sendBtn.disabled = true;
    sendBtn.title = "请先登录";
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtTime(t) {
  const d = new Date(t);
  const now = Date.now();
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function render(list) {
  if (!list.length) {
    listEl.innerHTML = "";
    stateEl.style.display = "block";
    stateEl.innerHTML = "还没有留言，来抢沙发～";
    return;
  }
  stateEl.style.display = "none";
  const isAdmin = !!(me && me.admin);
  listEl.innerHTML = list.map(m => {
    const ch = (m.name || "匿")[0];
    const av = m.avatar || ch;
    const delBtn = isAdmin
      ? `<button class="del-btn" onclick="delMsg('${esc(m.id)}', this)">删除</button>`
      : "";
    return `<div class="msg-row">
      <div class="avatar">${esc(av)}</div>
      <div class="msg-body">
        <div class="meta"><span class="name">${esc(m.name || "匿名")}</span><span class="time">${fmtTime(m.time)}</span>${delBtn}</div>
        <div class="text">${esc(m.text)}</div>
      </div>
    </div>`;
  }).join("");
}
function load() {
  me = getUser();
  updateAuthUI();
  listEl.innerHTML = "";
  stateEl.style.display = "block";
  stateEl.innerHTML = "加载中…";
  fetch("/api/msg")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(list => { lastList = Array.isArray(list) ? list : []; render(lastList); })
    .catch(e => {
      listEl.innerHTML = "";
      stateEl.style.display = "block";
      stateEl.innerHTML = `留言加载失败（${e.message}）。<br><button onclick="load()">重新加载</button>`;
    });
}
sendBtn.addEventListener("click", () => {
  const text = document.getElementById("inText").value.trim();
  if (!text) { alert("留言内容不能为空"); return; }
  if (!me) { alert("请先登录"); return; }
  sendBtn.disabled = true;
  sendBtn.textContent = "发布中…";
  fetch("/api/msg", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
    body: JSON.stringify({ text })
  })
    .then(r => { const st = r.status; return r.json().then(d => ({ st, d })); })
    .then(({ st, d }) => {
      if (d.ok) {
        document.getElementById("inText").value = "";
        load();
      } else {
        alert(d.error || "发布失败");
        if (st === 401) { me = null; updateAuthUI(); }
      }
    })
    .catch(e => alert("发布失败：" + e.message))
    .finally(() => { sendBtn.disabled = false; sendBtn.textContent = "发布留言"; updateAuthUI(); });
});
// 管理员删除留言
function delMsg(id, btn) {
  if (!confirm("确定删除这条留言？")) return;
  btn.disabled = true;
  fetch("/api/msg?id=" + encodeURIComponent(id), {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + getToken() }
  })
    .then(r => r.json())
    .then(d => {
      if (d.ok) load();
      else alert(d.error || "删除失败");
    })
    .catch(e => alert("删除失败：" + e.message))
    .finally(() => { btn.disabled = false; });
}
// 回焦点时刷新登录态（可能刚从首页登录完跳回）
window.addEventListener("focus", () => {
  const u = getUser();
  if ((u && u.username) !== (me && me.username)) { me = u; updateAuthUI(); render(Array.isArray(lastList) ? lastList : []); }
});
let lastList = null;
load();
</script>
</body>
</html>
