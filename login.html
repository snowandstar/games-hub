<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · games-hub</title>
<meta name="theme-color" content="#0b0918">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card {
  width: min(94vw, 400px);
  background: rgba(15,12,41,.82); backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px;
  box-shadow: 0 24px 70px rgba(0,0,0,.5);
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.brand svg { width: 34px; height: 34px; flex-shrink: 0; }
.brand .bn { font-size: 21px; font-weight: 800; letter-spacing: 1px; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
.auth-tab {
  flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--sub);
  padding: 9px 0; border-radius: 10px; font-size: 14px; cursor: pointer; transition: .15s;
}
.auth-tab:hover { color: var(--txt); border-color: var(--accent2); }
.auth-tab.on { background: var(--accent); color: #1e1b4b; border-color: var(--accent); font-weight: 700; }
.field {
  width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--txt);
  border-radius: 11px; padding: 12px 14px; font-size: 14.5px; outline: none; margin-bottom: 12px;
}
.field:focus { border-color: var(--accent2); }
.err { color: #fca5a5; font-size: 12.5px; min-height: 18px; margin: 2px 0 8px; }
.btn {
  width: 100%; border: 0; cursor: pointer; border-radius: 11px;
  background: var(--accent); color: #1e1b4b; font-size: 15px; font-weight: 700;
  padding: 12px 0; transition: .15s;
}
.btn:hover { background: #dbe3ff; }
.btn:disabled { opacity: .55; cursor: wait; }
.tip { text-align: center; font-size: 12px; color: var(--dim); margin-top: 16px; line-height: 1.7; }
.tip a { color: var(--accent2); text-decoration: none; }
::selection { background: rgba(165,180,252,.35); color: #fff; }
* { scrollbar-width: thin; scrollbar-color: rgba(165,180,252,.35) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: rgba(165,180,252,.3); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#302b63"/><path d="M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/></svg>
    <span class="bn">games-hub</span>
  </div>
  <div class="sub">登录后进入游戏中心、AI 助手、工具箱、影视音乐和留言板</div>
  <div class="auth-tabs">
    <button class="auth-tab on" id="tabLogin" type="button" onclick="setMode('login')">登录</button>
    <button class="auth-tab" id="tabReg" type="button" onclick="setMode('register')">注册</button>
  </div>
  <input class="field" type="text" id="authUser" placeholder="用户名（2-20 位字母/数字/中文）" autocomplete="username">
  <input class="field" type="password" id="authPass" placeholder="密码（至少 6 位）" autocomplete="current-password">
  <!-- 管理员邀请码：默认隐藏，仅 /login#setup 时露出，避免主动暴露该字段存在 -->
  <input class="field" type="password" id="authSetup" placeholder="管理员邀请码" autocomplete="off" style="display:none">
  <div class="err" id="authErr"></div>
  <button class="btn" id="authSubmit" type="button">登录</button>
  <div class="tip" id="authTip" style="display:none">注册成功后会自动登录</div>
</div>

<script>
let mode = "login";
const errEl = document.getElementById("authErr");

// ---------- next 回跳 ----------
// 规则与后端 safeNext() 保持一致，防开放重定向：只接受站内相对路径。
function safeNext(v) {
  if (typeof v !== "string" || !v) return "/";
  if (!v.startsWith("/") || v.startsWith("//")) return "/";   // 挡 //evil.com
  if (v.indexOf("\\") !== -1) return "/";                      // 挡 /\evil.com（浏览器会把 \ 当 /）
  if (/[\x00-\x1f\x7f]/.test(v)) return "/";                   // 换行/回车会拆出走私头
  if (v.length > 200) return "/";
  return v;
}
const next = safeNext(new URLSearchParams(location.search).get("next"));

// 自动回跳的循环保护：
// 若 ghub_gate（门禁 cookie）缺失但 ghub_token 仍有效，跳回 next 会被门禁再弹回 /login，
// 形成死循环。用 sessionStorage 记住"已经试过一次"，第二次就停在登录页让用户手动登录
// —— 手动登录会重新签发 ghub_gate，循环自然解开。
const TRIED_KEY = "ghub_login_autoredirect";
function redirectTried() {
  try { return sessionStorage.getItem(TRIED_KEY) === "1"; } catch (e) { return false; }
}
function markRedirectTried() {
  try { sessionStorage.setItem(TRIED_KEY, "1"); } catch (e) {}
}
function clearRedirectTried() {
  try { sessionStorage.removeItem(TRIED_KEY); } catch (e) {}
}
// replace 而非 href：登录页不该留在历史里，后退不会又回到登录页
function goNext() {
  clearRedirectTried();
  location.replace(next);
}

// ---------- 已登录用户直接跳走 ----------
// 注意：后端 getAuth() 只读 Authorization: Bearer，不读 cookie，
// 所以这里必须显式带上 localStorage 里的 ghub_token。
// 任何失败（无 token / 已过期 / 网络错误）都静默显示表单，不卡加载态、不报错。
async function skipIfLoggedIn() {
  let token = "";
  try { token = localStorage.getItem("ghub_token") || ""; } catch (e) {}
  if (!token) return;
  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": "Bearer " + token },
      cache: "no-store"
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) return;      // 未登录或会话已过期 -> 正常显示表单
    if (redirectTried()) return;       // 上次跳转被弹回过 -> 不再跳，等用户手动登录补发 gate cookie
    markRedirectTried();
    location.replace(next);
  } catch (e) {
    // 网络错误：正常显示表单
  }
}

function setMode(m) {
  mode = m;
  document.getElementById("tabLogin").classList.toggle("on", m === "login");
  document.getElementById("tabReg").classList.toggle("on", m === "register");
  document.getElementById("authSubmit").textContent = m === "login" ? "登录" : "注册";
  document.getElementById("authTip").style.display = m === "register" ? "" : "none";
  // 邀请码只在注册模式 + 显式 #setup 时露出
  document.getElementById("authSetup").style.display =
    (m === "register" && location.hash === "#setup") ? "" : "none";
  errEl.textContent = "";
}
async function submit() {
  const u = document.getElementById("authUser").value.trim();
  const p = document.getElementById("authPass").value;
  errEl.textContent = "";
  if (!u || !p) { errEl.textContent = "请填写用户名和密码"; return; }
  const btn = document.getElementById("authSubmit");
  btn.disabled = true;
  btn.textContent = "请稍候…";
  try {
    const body = { username: u, password: p };
    const setupEl = document.getElementById("authSetup");
    // 仅在输入框可见且非空时带上 setup_code，普通注册不带该字段
    if (mode === "register" && setupEl.style.display !== "none") {
      const sc = setupEl.value.trim();
      if (sc) body.setup_code = sc;
    }
    const res = await fetch("/api/auth/" + (mode === "login" ? "login" : "register"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const d = await res.json();
    if (!res.ok) { errEl.textContent = d.error || "操作失败"; btn.disabled = false; btn.textContent = mode === "login" ? "登录" : "注册"; return; }
    if (mode === "register") {
      // 注册接口不返回 token、也不签门禁 cookie，必须再调一次 login 才能进站
      const res2 = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const d2 = await res2.json();
      if (!d2.ok) {
        // 不能带着"注册成功但没有门禁 cookie"的状态跳走，否则会被门禁弹回登录页
        errEl.textContent = "注册成功，但自动登录失败，请手动登录一次。";
        setMode("login");
        btn.disabled = false;
        btn.textContent = "登录";
        return;
      }
      localStorage.setItem("ghub_token", d2.token);
      localStorage.setItem("ghub_user", JSON.stringify({ username: d2.username, admin: d2.admin }));
      if (d2.admin) alert("注册成功！已用管理员邀请码注册为管理员。");
    } else {
      localStorage.setItem("ghub_token", d.token);
      localStorage.setItem("ghub_user", JSON.stringify({ username: d.username, admin: d.admin }));
    }
    goNext();
  } catch (e) {
    errEl.textContent = "网络错误：" + e.message;
    btn.disabled = false;
    btn.textContent = mode === "login" ? "登录" : "注册";
  }
}
document.getElementById("authSubmit").addEventListener("click", submit);
document.getElementById("authPass").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
document.getElementById("authSetup").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
setMode("login");
skipIfLoggedIn();
</script>
</body>
</html>
