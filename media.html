<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视音乐 · games-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc; --pink:#f0abfc; --blue:#93c5fd;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt); min-height: 100vh;
}
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 218px; flex-shrink: 0; display: flex; flex-direction: column; gap: 26px;
  padding: 22px 16px 20px; background: rgba(10,8,30,.85); backdrop-filter: blur(14px);
  border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: 1px; padding: 0 6px; }
.logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.snav { display: flex; flex-direction: column; gap: 8px; }
.mnav {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; color: var(--sub);
  padding: 11px 14px; border-radius: 12px; font-size: 14px; cursor: pointer; text-decoration: none; transition: .15s;
}
.mnav svg { width: 18px; height: 18px; flex-shrink: 0; }
.mnav:hover { color: var(--txt); background: rgba(255,255,255,.06); border-color: var(--line); }
.mnav.on { background: linear-gradient(135deg, rgba(165,180,252,.22), rgba(124,58,237,.16)); color: var(--accent); border-color: rgba(165,180,252,.4); font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 11.5px; color: #5b6287; line-height: 1.7; }
.main { flex: 1; min-width: 0; }
.container { max-width: 1000px; margin: 0 auto; padding: 26px 22px 44px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.mtabs { display: flex; gap: 6px; margin-bottom: 18px; }
.mtab {
  border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--sub);
  padding: 7px 22px; border-radius: 999px; font-size: 13.5px; cursor: pointer; transition: .15s;
}
.mtab:hover { color: var(--txt); border-color: var(--accent2); }
.mtab.on { background: var(--accent); color: #1e1b4b; border-color: var(--accent); font-weight: 700; }
.addform { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.addform .row { display: flex; gap: 10px; flex-wrap: wrap; }
.addform input[type=text] {
  flex: 1; min-width: 160px; background: rgba(0,0,0,.3); border: 1px solid var(--line); color: var(--txt);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
}
.addform input:focus { border-color: var(--accent2); }
.addform .btn {
  border: 0; cursor: pointer; border-radius: 10px; background: var(--accent); color: #1e1b4b;
  font-size: 14px; font-weight: 700; padding: 10px 24px;
}
.addform .btn:hover { background: #dbe3ff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  position: relative; display: block; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-3px); border-color: rgba(165,180,252,.5); }
.card .type {
  position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
}
.card.movie .type { background: rgba(147,197,253,.16); color: var(--blue); border: 1px solid rgba(147,197,253,.35); }
.card.music .type { background: rgba(240,171,252,.16); color: var(--pink); border: 1px solid rgba(240,171,252,.35); }
.card h3 { font-size: 15px; margin-bottom: 6px; padding-right: 44px; }
.card .url { color: var(--dim); font-size: 12px; word-break: break-all; line-height: 1.5; }
.card .del {
  position: absolute; bottom: 12px; right: 12px; border: 0; background: rgba(255,255,255,.1);
  color: var(--dim); width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 14px;
}
.card .del:hover { background: rgba(239,68,68,.3); color: #fff; }
.empty { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 14px; }
.empty .hint { margin-top: 10px; font-size: 12.5px; color: #6d759c; }
@media (max-width: 820px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .sidebar-foot { display: none; }
  .snav { flex-direction: row; }
  .mnav { padding: 9px 12px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#302b63"/><path d="M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/></svg>
      games-hub
    </div>
    <nav class="snav">
      <a class="mnav" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M9 13h.01M15 10h.01M18 13h.01"/></svg>
        游戏中心
      </a>
      <a class="mnav" href="/#ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>
        AI 助手
      </a>
      <a class="mnav" href="/tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        工具箱
      </a>
      <a class="mnav on" href="/media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        影视音乐
      </a>
      <a class="mnav" href="/guestbook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        留言板
      </a>
    </nav>
    <div class="sidebar-foot">Cloudflare Pages 免费托管</div>
  </aside>
  <main class="main">
    <div class="container">
      <div class="page-head"><h1>影视音乐</h1></div>
      <div class="mtabs" id="mtabs">
        <button class="mtab on" data-c="movie">影视</button>
        <button class="mtab" data-c="music">音乐</button>
      </div>
      <div class="addform">
        <div class="row">
          <input type="text" id="inName" placeholder="名称（如：某电影 / 某首歌）">
          <input type="text" id="inUrl" placeholder="链接（视频页 / 音乐播放页）">
          <button class="btn" id="addBtn">添加收藏</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
      <div class="empty" id="empty" style="display:none">
        还没有收藏内容
        <div class="hint">在上方输入名称和链接，点「添加收藏」即可。收藏保存在你自己的浏览器里（localStorage）。<br>适合放你想看的影视、想听的音乐，点击卡片直接跳转。</div>
      </div>
    </div>
  </main>
</div>

<script>
const KEY = "ghub_media";
let items = [];
let curCat = "movie";
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function normUrl(u) {
  u = (u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(items));
  render();
}
function render() {
  const grid = document.getElementById("grid");
  const list = items.map((it, i) => ({ it, i })).filter(x => x.it.cat === curCat);
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  grid.innerHTML = list.map(({ it, i }) => {
    return `<a class="card ${it.cat}" href="${esc(normUrl(it.url))}" target="_blank" rel="noopener">
      <span class="type">${it.cat === "movie" ? "影视" : "音乐"}</span>
      <h3>${esc(it.name)}</h3>
      <div class="url">${esc(it.url)}</div>
      <button class="del" data-i="${i}" onclick="event.preventDefault();event.stopPropagation();del(${i})">×</button>
    </a>`;
  }).join("");
}
function del(idx) {
  items.splice(idx, 1);
  save();
}
document.getElementById("addBtn").addEventListener("click", () => {
  const name = document.getElementById("inName").value.trim();
  const url = normUrl(document.getElementById("inUrl").value);
  if (!name || !url) return;
  items.push({ name, url, cat: curCat });
  document.getElementById("inName").value = "";
  document.getElementById("inUrl").value = "";
  save();
});
document.getElementById("mtabs").addEventListener("click", e => {
  const b = e.target.closest(".mtab");
  if (!b) return;
  document.querySelectorAll(".mtab").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  curCat = b.dataset.c;
  render();
});
render();
</script>
</body>
</html>
