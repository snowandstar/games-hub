<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:#12121a; --card:#1c1c2b; --line:rgba(255,255,255,.09);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8; --accent:#c7d2fe; --accent2:#a5b4fc;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(900px 420px at 80% -10%, rgba(167,139,250,.14), transparent 60%),
    var(--bg);
  color: var(--txt); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.wrap { width: 100%; max-width: 560px; text-align: center; }
.code {
  font-size: 64px; font-weight: 800; letter-spacing: 2px; line-height: 1;
  background: linear-gradient(120deg, var(--accent), #f0abfc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
h1 { font-size: 22px; font-weight: 700; margin: 18px 0 10px; }
p { color: var(--sub); font-size: 14px; line-height: 1.7; }
.card {
  margin-top: 28px; padding: 20px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
}
.card h2 {
  font-size: 12px; font-weight: 600; color: var(--dim);
  text-align: left; margin-bottom: 12px; letter-spacing: .5px;
}
a.btn, a.game {
  display: block; text-decoration: none; color: var(--txt);
  border-radius: 10px; transition: .15s;
}
a.btn {
  background: linear-gradient(120deg, var(--accent2), #818cf8);
  padding: 12px 20px; font-size: 15px; font-weight: 700; margin-bottom: 18px;
}
a.btn:hover { filter: brightness(1.12); }
a.game {
  padding: 11px 14px; font-size: 14px; text-align: left;
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  margin-bottom: 8px;
}
a.game:last-child { margin-bottom: 0; }
a.game:hover { background: rgba(255,255,255,.1); border-color: var(--accent2); }
a.game span { color: var(--dim); font-size: 12px; margin-left: 8px; }
@media (max-width: 420px) { .code { font-size: 48px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>你要找的地址已经失效或从未存在过。<br>回游戏中心挑一个玩吧。</p>

  <div class="card">
    <h2>换个游戏试试</h2>
    <a class="game" href="/minecraft.html">我的世界 1.8.8<span>H5</span></a>
    <a class="game" href="/minecraft-1122.html">我的世界 1.12.2<span>H5</span></a>
    <a class="game" href="/game.html?id=bleshui-vs-huoYing-3.3">死神VS火影 3.3<span>Flash</span></a>
  </div>

  <div class="card">
    <a class="btn" href="/">回游戏中心</a>
  </div>
</div>
</body>
</html>
