<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 预设管理 · games-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt); min-height: 100vh; padding: 28px 20px;
}
.wrap { max-width: 860px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.top .tt { font-size: 21px; font-weight: 800; letter-spacing: 1px; }
.top a { color: var(--accent2); font-size: 13px; text-decoration: none; }
.top a:hover { text-decoration: underline; }
.desc { color: var(--sub); font-size: 13px; line-height: 1.8; margin-bottom: 22px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.card {
  background: rgba(15,12,41,.84); backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; margin-bottom: 22px;
  box-shadow: 0 18px 50px rgba(0,0,0,.4);
}
.card h3 { font-size: 15px; font-weight: 800; margin-bottom: 14px; color: var(--sub); letter-spacing: .5px; }
.field {
  width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--txt);
  border-radius: 11px; padding: 11px 14px; font-size: 14px; outline: none; margin-bottom: 10px;
}
.field:focus { border-color: var(--accent2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .field { margin-bottom: 0; }
.btn {
  border: 0; cursor: pointer; border-radius: 10px;
  background: var(--accent); color: #1e1b4b; font-size: 13.5px; font-weight: 700;
  padding: 10px 26px; transition: .15s;
}
.btn:hover { background: #dbe3ff; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--txt); border: 1px solid var(--line); padding: 6px 14px; font-size: 12.5px; }
.btn.ghost:hover { background: rgba(255,255,255,.14); }
.btn.danger { background: rgba(248,113,113,.15); color: #fca5a5; border: 1px solid rgba(248,113,113,.35); padding: 6px 14px; font-size: 12.5px; }
.err { color: #fca5a5; font-size: 12.5px; min-height: 16px; margin-bottom: 8px; }
.okmsg { color: #86efac; font-size: 12.5px; min-height: 16px; margin-bottom: 8px; }
.list-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 0; }
.p-item {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
  background: rgba(255,255,255,.04);
}
.p-info { min-width: 0; }
.p-name { font-weight: 800; font-size: 14.5px; }
.p-model { color: var(--accent2); font-size: 12.5px; margin-top: 2px; }
.p-base { color: var(--dim); font-size: 11.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-desc { color: var(--sub); font-size: 12px; margin-top: 3px; }
.p-ops { display: flex; gap: 8px; flex-shrink: 0; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="tt">AI 预设模型管理</span>
    <a href="/account">← 返回账号设置</a>
  </div>

  <div class="desc">
    在这里配置站点预设模型：普通用户登录后打开 AI 助手即可选择这些模型直接对话（无需自己填 Key），消耗的是你填入的 Key 额度。Key 只保存在站点服务器，普通用户看不到。预设为空时，用户只能使用自己配置的 Key。
  </div>

  <div class="card">
    <h3 id="formTitle">添加预设</h3>
    <input class="field" id="fName" placeholder="显示名称（如：DeepSeek 对话）">
    <div class="grid2">
      <input class="field" id="fBase" placeholder="API 地址（如 https://api.deepseek.com/v1）">
      <div style="position:relative;">
        <input class="field" id="fModel" placeholder="模型名（如 deepseek-chat）" list="modelList" autocomplete="off">
        <datalist id="modelList"></datalist>
      </div>
    </div>
    <input class="field" id="fKey" placeholder="API Key（仅站长可见，保存后列表不显示）" autocomplete="off">
    <div style="margin:-4px 0 6px;">
      <button class="btn ghost" id="fetchModelsBtn" type="button">一键获取模型</button>
      <span style="font-size:12px;color:#8a92b8;">填好 API 地址和 Key 后点这里，自动拉取该服务商的可用模型列表，在「模型名」框里直接选</span>
    </div>
    <input class="field" id="fDesc" placeholder="描述（选填，如：性价比高）">
    <div class="err" id="errBox"></div>
    <div class="okmsg" id="okBox"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="saveBtn">添加预设</button>
      <button class="btn ghost" id="cancelBtn" style="display:none;">取消编辑</button>
    </div>
  </div>

  <div class="card">
    <h3>当前预设（<span id="presetCount">0</span>）</h3>
    <div id="listBox"><div class="list-empty">加载中…</div></div>
  </div>
</div>

<script>
const TOKEN_KEY = "ghub_token";
const USER_KEY = "ghub_user";
function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || "null"); } catch (e) { return null; } }

let editingId = "";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function setErr(t) { document.getElementById("errBox").textContent = t; }
function setOk(t) { const el = document.getElementById("okBox"); el.textContent = t; setTimeout(() => el.textContent = "", 4000); }

async function api(method, body, id) {
  const headers = { "Authorization": "Bearer " + getToken() };
  let u = "/api/ai/presets";
  if (method === "DELETE") u += "?id=" + encodeURIComponent(id);
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(u, { method, headers, body: body ? JSON.stringify(body) : undefined });
  return res.json();
}

async function loadList() {
  const box = document.getElementById("listBox");
  const res = await api("GET");
  if (!res.ok) { box.innerHTML = `<div class="list-empty">加载失败：${esc(res.error || "")}</div>`; return; }
  const list = res.presets || [];
  document.getElementById("presetCount").textContent = list.length;
  if (!list.length) { box.innerHTML = `<div class="list-empty">还没有预设模型，用上面的表单添加第一个吧。</div>`; return; }
  box.innerHTML = list.map(p => `
    <div class="p-item">
      <div class="p-info">
        <div class="p-name">${esc(p.name)}</div>
        <div class="p-model">${esc(p.model)}</div>
        <div class="p-base">${esc(p.baseURL)}</div>
        ${p.desc ? `<div class="p-desc">${esc(p.desc)}</div>` : ""}
      </div>
      <div class="p-ops">
        <button class="btn ghost" onclick="editPreset('${p.id}')">编辑</button>
        <button class="btn danger" onclick="delPreset('${p.id}')">删除</button>
      </div>
    </div>`).join("");
}

function resetForm() {
  editingId = "";
  document.getElementById("fName").value = "";
  document.getElementById("fBase").value = "";
  document.getElementById("fModel").value = "";
  document.getElementById("fKey").value = "";
  document.getElementById("fDesc").value = "";
  document.getElementById("formTitle").textContent = "添加预设";
  document.getElementById("saveBtn").textContent = "添加预设";
  document.getElementById("cancelBtn").style.display = "none";
  setErr("");
}

async function editPreset(id) {
  const res = await api("GET");
  const p = (res.presets || []).find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById("fName").value = p.name;
  document.getElementById("fBase").value = p.baseURL;
  document.getElementById("fModel").value = p.model;
  document.getElementById("fKey").value = "";
  document.getElementById("fDesc").value = p.desc || "";
  document.getElementById("formTitle").textContent = "编辑预设（Key 留空则不修改）";
  document.getElementById("saveBtn").textContent = "保存修改";
  document.getElementById("cancelBtn").style.display = "";
  setErr("");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function delPreset(id) {
  if (!confirm("确定删除该预设？")) return;
  const res = await api("DELETE", null, id);
  if (!res.ok) { setErr(res.error || "删除失败"); return; }
  setOk("已删除");
  if (editingId === id) resetForm();
  loadList();
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  const body = {
    name: document.getElementById("fName").value.trim(),
    baseURL: document.getElementById("fBase").value.trim(),
    model: document.getElementById("fModel").value.trim(),
    key: document.getElementById("fKey").value.trim(),
    desc: document.getElementById("fDesc").value.trim()
  };
  if (editingId) body.id = editingId;
  setErr("");
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "保存中…";
  const res = await api(editingId ? "PUT" : "POST", body);
  btn.disabled = false; btn.textContent = editingId ? "保存修改" : "添加预设";
  if (!res.ok) { setErr(res.error || "保存失败"); return; }
  setOk("已保存");
  resetForm();
  loadList();
});

document.getElementById("cancelBtn").addEventListener("click", resetForm);

// 一键获取模型：走 Worker 代理调服务商 GET /models（浏览器直连有 CORS）
document.getElementById("fetchModelsBtn").addEventListener("click", async () => {
  const btn = document.getElementById("fetchModelsBtn");
  const baseURL = document.getElementById("fBase").value.trim();
  const key = document.getElementById("fKey").value.trim();
  if (!baseURL || !key) { setErr("先填好 API 地址和 API Key，再一键获取模型"); return; }
  setErr("");
  btn.disabled = true; btn.textContent = "获取中…";
  try {
    const res = await fetch("/api/ai/models", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
      body: JSON.stringify({ baseURL, key })
    });
    const d = await res.json().catch(() => ({}));
    if (!d.ok) { setErr(d.error || "获取失败"); return; }
    document.getElementById("modelList").innerHTML = d.models.map(m => `<option value="${esc(m)}">`).join("");
    setOk(`获取到 ${d.models.length} 个模型，点击「模型名」输入框即可下拉选择`);
  } catch (e) {
    setErr("获取失败：" + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "一键获取模型";
  }
});

(async () => {
  const u = getUser();
  if (!u || !u.username) { location.href = "/login"; return; }
  if (!u.admin) { document.getElementById("listBox").innerHTML = `<div class="list-empty">需要管理员权限才能管理预设。</div>`; return; }
  loadList();
})();
</script>
</body>
</html>
