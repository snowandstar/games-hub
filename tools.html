<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱 · games-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc; --blue:#93c5fd;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt); min-height: 100vh;
}
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 218px; flex-shrink: 0; display: flex; flex-direction: column; gap: 26px;
  padding: 22px 16px 20px; background: rgba(10,8,30,.85); backdrop-filter: blur(14px);
  border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: 1px; padding: 0 6px; }
.logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.snav { display: flex; flex-direction: column; gap: 8px; }
.mnav {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; color: var(--sub);
  padding: 11px 14px; border-radius: 12px; font-size: 14px; cursor: pointer; text-decoration: none; transition: .15s;
}
.mnav svg { width: 18px; height: 18px; flex-shrink: 0; }
.mnav:hover { color: var(--txt); background: rgba(255,255,255,.06); border-color: var(--line); }
.mnav.on { background: linear-gradient(135deg, rgba(165,180,252,.22), rgba(124,58,237,.16)); color: var(--accent); border-color: rgba(165,180,252,.4); font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 11.5px; color: #5b6287; line-height: 1.7; }
.sidebar-foot a { color: var(--dim); text-decoration: none; }
.main { flex: 1; min-width: 0; }
.container { max-width: 1000px; margin: 0 auto; padding: 26px 22px 44px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.ttabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.ttab {
  border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--sub);
  padding: 7px 16px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .15s;
}
.ttab:hover { color: var(--txt); border-color: var(--accent2); }
.ttab.on { background: var(--accent); color: #1e1b4b; border-color: var(--accent); font-weight: 700; }
.tpanel { display: none; }
.tpanel.on { display: block; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.pcard h2 { font-size: 16px; margin-bottom: 14px; color: var(--accent); }
label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 6px; }
input[type=text], input[type=number], textarea, select {
  width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--line); color: var(--txt);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent2); }
textarea { min-height: 120px; resize: vertical; }
.btn {
  display: inline-block; border: 0; cursor: pointer; border-radius: 10px;
  background: var(--accent); color: #1e1b4b; font-size: 14px; font-weight: 700;
  padding: 10px 24px; margin-top: 14px; transition: .15s;
}
.btn:hover { background: #dbe3ff; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--txt); border: 1px solid var(--line); }
.btn.ghost:hover { background: rgba(255,255,255,.14); }
.outbox { margin-top: 14px; padding: 14px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-size: 14px; word-break: break-all; min-height: 44px; }
.outbox .dim { color: var(--dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 130px; }
#qrBox { margin-top: 16px; display: flex; justify-content: center; }
#qrBox canvas, #qrBox img { background: #fff; padding: 10px; border-radius: 10px; }
#mdOut { min-height: 260px; line-height: 1.7; }
#mdOut h1, #mdOut h2, #mdOut h3 { margin: 14px 0 8px; }
#mdOut p { margin: 8px 0; }
#mdOut code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
#mdOut pre { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; overflow: auto; margin: 10px 0; }
#mdOut pre code { background: none; padding: 0; }
#mdOut ul, #mdOut ol { padding-left: 22px; margin: 8px 0; }
#mdOut table { border-collapse: collapse; margin: 10px 0; }
#mdOut th, #mdOut td { border: 1px solid var(--line); padding: 6px 12px; }
#imgPrev { margin-top: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
#imgPrev img { max-width: 220px; border-radius: 10px; border: 1px solid var(--line); }
.dl-btn { text-decoration: none; text-align: center; }
@media (max-width: 820px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .sidebar-foot { display: none; }
  .snav { flex-direction: row; }
  .mnav { padding: 9px 12px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#302b63"/><path d="M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/></svg>
      games-hub
    </div>
    <nav class="snav">
      <a class="mnav" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M9 13h.01M15 10h.01M18 13h.01"/></svg>
        游戏中心
      </a>
      <a class="mnav" href="/#ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>
        AI 助手
      </a>
      <a class="mnav on" href="/tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        工具箱
      </a>
      <a class="mnav" href="/media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        影视音乐
      </a>
      <a class="mnav" href="/guestbook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        留言板
      </a>
    </nav>
    <div class="sidebar-foot">Cloudflare Pages 免费托管</div>
  </aside>
  <main class="main">
    <div class="container">
      <div class="page-head"><h1>实用工具箱</h1></div>
      <div class="ttabs" id="ttabs">
        <button class="ttab on" data-t="qr">二维码</button>
        <button class="ttab" data-t="ts">时间戳</button>
        <button class="ttab" data-t="hex">进制转换</button>
        <button class="ttab" data-t="txt">文本统计</button>
        <button class="ttab" data-t="img">图片压缩</button>
        <button class="ttab" data-t="md">Markdown 预览</button>
      </div>

      <div class="tpanel on" id="t-qr">
        <div class="pcard">
          <h2>二维码生成</h2>
          <label>内容（文本 / 网址 / Wi-Fi 配置等）</label>
          <textarea id="qrText" placeholder="输入要生成二维码的内容，例如 https://example.com 或 WIFI:T:WPA;S:名称;P:密码;;"></textarea>
          <button class="btn" id="qrBtn">生成二维码</button>
          <div id="qrBox"></div>
        </div>
      </div>

      <div class="tpanel" id="t-ts">
        <div class="pcard">
          <h2>时间戳转换</h2>
          <div class="row">
            <div>
              <label>时间戳（秒）→ 日期时间</label>
              <input type="number" id="tsSec" placeholder="例如 1700000000">
              <button class="btn" id="tsToDate">转换</button>
              <div class="outbox" id="tsSecOut"><span class="dim">结果</span></div>
            </div>
            <div>
              <label>日期时间 → 时间戳（秒）</label>
              <input type="text" id="tsDate" placeholder="2026-10-17 12:00:00">
              <button class="btn" id="tsToSec">转换</button>
              <div class="outbox" id="tsDateOut"><span class="dim">结果</span></div>
            </div>
          </div>
          <button class="btn ghost" id="tsNow">取当前时间戳</button>
        </div>
      </div>

      <div class="tpanel" id="t-hex">
        <div class="pcard">
          <h2>进制转换</h2>
          <div class="row">
            <div>
              <label>十进制</label>
              <input type="number" id="hexDec" placeholder="10">
            </div>
            <div>
              <label>二进制</label>
              <input type="text" id="hexBin" placeholder="1010">
            </div>
            <div>
              <label>八进制</label>
              <input type="text" id="hexOct" placeholder="12">
            </div>
            <div>
              <label>十六进制</label>
              <input type="text" id="hexHex" placeholder="a">
            </div>
          </div>
          <button class="btn" id="hexBtn">互相转换</button>
        </div>
      </div>

      <div class="tpanel" id="t-txt">
        <div class="pcard">
          <h2>文本统计</h2>
          <label>输入文本</label>
          <textarea id="txtInput" placeholder="粘贴或输入文本…"></textarea>
          <button class="btn" id="txtBtn">统计</button>
          <div class="outbox" id="txtOut"><span class="dim">结果</span></div>
        </div>
      </div>

      <div class="tpanel" id="t-img">
        <div class="pcard">
          <h2>图片压缩</h2>
          <label>选择图片（在浏览器本地处理，不上传服务器）</label>
          <input type="file" id="imgFile" accept="image/*">
          <div class="row">
            <div>
              <label>压缩质量（0.1 ~ 1）</label>
              <input type="number" id="imgQ" value="0.7" min="0.1" max="1" step="0.05">
            </div>
            <div>
              <label>最大宽/高（像素，留空不缩放）</label>
              <input type="number" id="imgMax" placeholder="1920">
            </div>
          </div>
          <button class="btn" id="imgBtn">压缩</button>
          <div id="imgPrev"></div>
        </div>
      </div>

      <div class="tpanel" id="t-md">
        <div class="pcard">
          <h2>Markdown 预览</h2>
          <label>输入 Markdown（左侧编辑右侧预览）</label>
          <textarea id="mdInput" placeholder="# 标题&#10;输入 Markdown 内容…" style="min-height:180px"></textarea>
          <button class="btn ghost" id="mdBtn">刷新预览</button>
          <div class="outbox" id="mdOut" style="margin-top:20px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// 工具 tab 切换
const ttabs = document.getElementById("ttabs");
ttabs.addEventListener("click", e => {
  const b = e.target.closest(".ttab");
  if (!b) return;
  document.querySelectorAll(".ttab").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".tpanel").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  document.getElementById("t-" + b.dataset.t).classList.add("on");
});

// 二维码
let qrcode = null;
document.getElementById("qrBtn").addEventListener("click", () => {
  const v = document.getElementById("qrText").value.trim();
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  if (!v) return;
  if (qrcode) qrcode.clear();
  qrcode = new QRCode(box, { text: v, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
});

// 时间戳
function fmtDate(sec) {
  const d = new Date(sec * 1000);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" + String(d.getSeconds()).padStart(2,"0");
}
document.getElementById("tsToDate").addEventListener("click", () => {
  const s = parseInt(document.getElementById("tsSec").value, 10);
  const o = document.getElementById("tsSecOut");
  if (isNaN(s)) { o.innerHTML = '<span class="dim">请输入有效时间戳</span>'; return; }
  o.textContent = fmtDate(s) + "（毫秒：" + (s * 1000) + "）";
});
document.getElementById("tsToSec").addEventListener("click", () => {
  const v = document.getElementById("tsDate").value.trim();
  const o = document.getElementById("tsDateOut");
  if (!v) { o.innerHTML = '<span class="dim">请输入日期时间</span>'; return; }
  const t = new Date(v.replace(/-/g, "/")).getTime();
  if (isNaN(t)) { o.innerHTML = '<span class="dim">格式无效，示例：2026-10-17 12:00:00</span>'; return; }
  o.textContent = Math.floor(t / 1000) + " 秒（" + t + " 毫秒）";
});
document.getElementById("tsNow").addEventListener("click", () => {
  document.getElementById("tsSec").value = Math.floor(Date.now() / 1000);
  document.getElementById("tsSecOut").textContent = fmtDate(Math.floor(Date.now() / 1000));
});

// 进制转换
document.getElementById("hexBtn").addEventListener("click", () => {
  const dec = document.getElementById("hexDec").value.trim();
  const bin = document.getElementById("hexBin").value.trim();
  const oct = document.getElementById("hexOct").value.trim();
  const hex = document.getElementById("hexHex").value.trim();
  let n = null;
  if (dec !== "") n = parseInt(dec, 10);
  else if (bin !== "") n = parseInt(bin, 2);
  else if (oct !== "") n = parseInt(oct, 8);
  else if (hex !== "") n = parseInt(hex, 16);
  if (n === null || isNaN(n)) return;
  document.getElementById("hexDec").value = n.toString(10);
  document.getElementById("hexBin").value = n.toString(2);
  document.getElementById("hexOct").value = n.toString(8);
  document.getElementById("hexHex").value = n.toString(16);
});

// 文本统计
document.getElementById("txtBtn").addEventListener("click", () => {
  const t = document.getElementById("txtInput").value;
  const cn = (t.match(/[\u4e00-\u9fa5]/g) || []).length;
  const en = (t.match(/[A-Za-z]+/g) || []).length;
  const lines = t ? t.split("\n").length : 0;
  const words = (t.match(/[\w\u4e00-\u9fa5]+/g) || []).length;
  document.getElementById("txtOut").innerHTML =
    "总字符：<b>" + t.length + "</b>　汉字：<b>" + cn + "</b>　英文单词：<b>" + en + "</b>　总词数：<b>" + words + "</b>　行数：<b>" + lines + "</b>";
});

// 图片压缩
document.getElementById("imgBtn").addEventListener("click", () => {
  const f = document.getElementById("imgFile").files[0];
  const prev = document.getElementById("imgPrev");
  prev.innerHTML = "";
  if (!f) return;
  const q = parseFloat(document.getElementById("imgQ").value) || 0.7;
  const max = parseInt(document.getElementById("imgMax").value, 10) || 0;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (max && Math.max(w, h) > max) {
        const r = max / Math.max(w, h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const url = c.toDataURL("image/jpeg", q);
      const size = Math.round((url.length - "data:image/jpeg;base64,".length) * 0.75);
      const a = document.createElement("a");
      a.href = url; a.download = "compressed.jpg"; a.className = "btn dl-btn"; a.textContent = "下载压缩图（" + Math.round(size/1024) + " KB）";
      prev.innerHTML = `<div><img src="${URL.createObjectURL(f)}"><p class="dim" style="font-size:12px;margin-top:6px">原图 ${Math.round(f.size/1024)} KB · ${img.width}x${img.height}</p></div><div><img src="${url}"><p class="dim" style="font-size:12px;margin-top:6px">压缩后约 ${Math.round(size/1024)} KB · ${w}x${h}（质量 ${q}）</p></div>`;
      prev.appendChild(a);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
});

// Markdown 预览
document.getElementById("mdBtn").addEventListener("click", () => {
  const v = document.getElementById("mdInput").value;
  document.getElementById("mdOut").innerHTML = v ? marked.parse(v) : "";
});
document.getElementById("mdInput").addEventListener("input", () => {
  const v = document.getElementById("mdInput").value;
  document.getElementById("mdOut").innerHTML = v ? marked.parse(v) : "";
});
</script>
</body>
</html>
