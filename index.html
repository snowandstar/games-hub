<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>games-hub | 游戏中心 · AI 助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23302b63'/%3E%3Cpath d='M14 26a12 12 0 0 1 24 0M50 26a12 12 0 0 0-24 0' fill='none' stroke='%23e0e7ff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M6 30h6M52 30h6M26 40h-8v8M30 44h-8' stroke='%23c7d2fe' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='44' cy='40' r='3' fill='%23f0abfc'/%3E%3Ccircle cx='50' cy='44' r='2.2' fill='%2393c5fd'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --card-hover:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.1); --txt:#fff; --sub:#b9c2e0; --dim:#8a92b8;
  --accent:#c7d2fe; --accent2:#a5b4fc; --pink:#f0abfc; --blue:#93c5fd;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 460px at -10% 20%, rgba(147,197,253,.12), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment: fixed;
  color: var(--txt);
  min-height: 100vh;
}
.layout { display: flex; min-height: 100vh; }

/* ===== 左侧导航栏 ===== */
.sidebar {
  width: 218px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 26px;
  padding: 22px 16px 20px;
  background: rgba(10,8,30,.85);
  backdrop-filter: blur(14px);
  border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: 1px; padding: 0 6px; }
.logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.logo .sub { color: var(--dim); font-size: 11.5px; font-weight: 400; letter-spacing: 0; }
.snav { display: flex; flex-direction: column; gap: 8px; }
.mnav {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; color: var(--sub);
  padding: 11px 14px; border-radius: 12px; font-size: 14px; cursor: pointer; transition: .15s;
}
.mnav svg { width: 18px; height: 18px; flex-shrink: 0; }
.mnav:hover { color: var(--txt); background: rgba(255,255,255,.06); border-color: var(--line); }
.mnav.on {
  background: linear-gradient(135deg, rgba(165,180,252,.22), rgba(124,58,237,.16));
  color: var(--accent); border-color: rgba(165,180,252,.4); font-weight: 700;
}
.sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 11.5px; color: #5b6287; line-height: 1.7; }
.sidebar-foot a { color: var(--dim); text-decoration: none; }
.sidebar-foot a:hover { color: var(--accent2); }

/* ===== 登录 / 账号 ===== */
.user-box {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 4px; padding: 12px 6px 0; border-top: 1px solid var(--line);
}
.user-btn {
  border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--sub);
  padding: 7px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: .15s;
}
.user-btn:hover { color: var(--txt); border-color: var(--accent2); background: rgba(255,255,255,.14); }
.user-btn.small { padding: 5px 12px; font-size: 12px; }
.user-info { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.user-info .uname { font-size: 13px; font-weight: 700; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-info .uadmin { font-size: 11px; color: var(--pink); border: 1px solid rgba(240,171,252,.35); padding: 1px 7px; border-radius: 999px; flex-shrink: 0; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(5,3,20,.72); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  width: min(92vw, 380px);
  background: linear-gradient(165deg, #211d4e, #0f0c29);
  border: 1px solid var(--line); border-radius: 18px; padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; letter-spacing: 1px; }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.auth-tab {
  flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--sub);
  padding: 8px 0; border-radius: 10px; font-size: 13.5px; cursor: pointer; transition: .15s;
}
.auth-tab:hover { color: var(--txt); border-color: var(--accent2); }
.auth-tab.on { background: var(--accent); color: #1e1b4b; border-color: var(--accent); font-weight: 700; }
.modal input[type=text], .modal input[type=password] {
  width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--txt);
  border-radius: 10px; padding: 11px 13px; font-size: 14px; outline: none; margin-bottom: 10px;
}
.modal input:focus { border-color: var(--accent2); }
.auth-err { color: #fca5a5; font-size: 12.5px; min-height: 18px; margin: 2px 0 4px; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.btn {
  border: 0; cursor: pointer; border-radius: 10px;
  background: var(--accent); color: #1e1b4b; font-size: 14px; font-weight: 700;
  padding: 11px 0; transition: .15s;
}
.btn:hover { background: #dbe3ff; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--txt); border: 1px solid var(--line); }
.btn.ghost:hover { background: rgba(255,255,255,.14); }
.auth-tip { text-align: center; font-size: 12px; color: var(--dim); margin-top: 12px; }

/* ===== 右侧内容 ===== */
.main { flex: 1; min-width: 0; }
.container { max-width: 1080px; margin: 0 auto; padding: 26px 22px 44px; }

/* ===== 游戏模块 ===== */
#view-games { display: block; }
.games-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.games-head h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.games-head .counts { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.counts .pill {
  font-size: 12px; padding: 4px 12px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--sub);
}
.counts .pill b { color: var(--accent); font-weight: 700; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--sub);
  padding: 6px 16px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .15s;
}
.tab:hover { color: var(--txt); border-color: var(--accent2); }
.tab.on { background: var(--accent); color: #1e1b4b; border-color: var(--accent); font-weight: 700; }
.tab .n { font-size: 11px; opacity: .7; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.card {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border-radius: 16px; overflow: hidden; cursor: pointer;
  border: 1px solid var(--line);
  transition: transform .18s, box-shadow .18s, border-color .18s;
  position: relative;
}
.card:hover, .card:focus-visible {
  transform: translateY(-5px);
  box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(165,180,252,.35);
  border-color: rgba(165,180,252,.5);
  outline: none;
}
.cover {
  position: relative; width: 100%; aspect-ratio: 16/10; overflow: hidden;
  background:
    radial-gradient(160px 120px at 20% 15%, rgba(147,197,253,.25), transparent 70%),
    radial-gradient(180px 130px at 85% 85%, rgba(240,171,252,.18), transparent 70%),
    linear-gradient(140deg, #1e1b4b, #312e81 55%, #4338ca);
  display: flex; align-items: center; justify-content: center;
}
.cover img { max-width: 62%; max-height: 78%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
.badge-ver {
  position: absolute; top: 10px; left: 10px;
  font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  background: rgba(0,0,0,.45); color: var(--accent); border: 1px solid rgba(199,212,254,.3);
  backdrop-filter: blur(4px);
}
.badge-type {
  position: absolute; bottom: 10px; right: 10px;
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  background: rgba(240,171,252,.16); color: var(--pink); border: 1px solid rgba(240,171,252,.35);
  backdrop-filter: blur(4px);
}
.card.h5 .badge-type { background: rgba(147,197,253,.16); color: var(--blue); border-color: rgba(147,197,253,.35); }
.info { padding: 13px 15px 15px; }
.info h3 { font-size: 16px; margin-bottom: 4px; letter-spacing: .3px; }
.info .meta { display: flex; justify-content: space-between; align-items: center; }
.info .size { color: var(--dim); font-size: 12px; }
.info .play {
  font-size: 12px; color: var(--accent2); opacity: 0; transform: translateX(-4px);
  transition: .18s;
}
.card:hover .play, .card:focus-visible .play { opacity: 1; transform: none; }
.skeleton {
  border-radius: 16px; border: 1px solid var(--line);
  background: linear-gradient(100deg, rgba(255,255,255,.05) 40%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.05) 60%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  aspect-ratio: 4/3;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.state { text-align: center; padding: 70px 20px; color: var(--dim); font-size: 14px; }
.state button {
  margin-top: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.08);
  color: var(--txt); padding: 8px 22px; border-radius: 10px; cursor: pointer; font-size: 14px;
}
.state button:hover { background: rgba(255,255,255,.15); }

/* ===== AI 助手模块 ===== */
#view-ai { display: none; }
.ai-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.ai-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.ai-bar .ai-open {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--sub);
  padding: 8px 18px; border-radius: 999px; font-size: 13px; text-decoration: none; transition: .15s;
}
.ai-bar .ai-open:hover { color: var(--txt); border-color: var(--accent2); }
.ai-wrap {
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  background: rgba(15,12,41,.55); box-shadow: 0 14px 40px rgba(0,0,0,.3);
  backdrop-filter: blur(10px);
}
.ai-wrap iframe {
  width: 100%; height: calc(100vh - 210px); min-height: 520px;
  border: 0; display: block;
}
.ai-tip {
  margin: 14px auto 0; max-width: 660px; text-align: center;
  color: var(--sub); font-size: 12.5px; line-height: 1.8;
  background: rgba(255,255,255,.05); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 18px;
}

/* ===== UI 全面优化 v2：导航指示条 / 统计发光 / 滚动条 / 微动效 ===== */
.mnav { position: relative; overflow: hidden; }
.mnav::before {
  content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--accent), var(--pink));
  transform: scaleY(0); transition: transform .2s ease;
}
.mnav:hover::before { transform: scaleY(.6); }
.mnav.on::before { transform: scaleY(1); }
.mnav svg { transition: transform .2s ease; }
.mnav:hover svg { transform: scale(1.12); }
.counts .pill { transition: .2s; }
.counts .pill:hover { border-color: rgba(165,180,252,.4); background: rgba(255,255,255,.1); }
.counts .pill b {
  background: linear-gradient(135deg, var(--accent), var(--pink));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.tab .n {
  display: inline-block; min-width: 18px; text-align: center;
  font-size: 10.5px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 1px 5px;
}
.tab.on .n { background: rgba(30,27,75,.18); }
.cover img { transition: transform .25s ease; }
.card:hover .cover img { transform: scale(1.06); }
.card { will-change: transform; }
::selection { background: rgba(165,180,252,.35); color: #fff; }
* { scrollbar-width: thin; scrollbar-color: rgba(165,180,252,.35) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: rgba(165,180,252,.3); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(165,180,252,.5); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== 窄屏：侧边栏转顶部 ===== */
@media (max-width: 820px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%; height: auto; position: sticky; top: 0;
    flex-direction: row; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  .sidebar-foot { display: none; }
  .snav { flex-direction: row; }
  .mnav { padding: 9px 14px; border-radius: 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .info h3 { font-size: 14px; }
  .info .play { display: none; }
  .ai-wrap iframe { min-height: 72vh; }
}
</style>
</head>

<!-- 登录 / 注册弹窗 -->

<script>
const API_BASE = "/api";
let GAMES = [];
let curFilter = "all";

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtSize(mb) {
  if (mb == null) return "";
  return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : mb + " MB";
}
function coverHtml(g) {
  const ver = (g.name.match(/([\d.]+)\s*$/) || [])[1] || "";
  const typeLabel = g.type === "flash" ? "Flash" : "H5";
  return `<div class="cover">
    <img src="${esc(g.icon || "/default.svg")}" alt="${esc(g.name)}" loading="lazy" onerror="this.src='/default.svg'">
    ${ver ? `<span class="badge-ver">v${esc(ver)}</span>` : ""}
    <span class="badge-type">${typeLabel}</span>
  </div>`;
}
function cardHtml(g) {
  const href = g.url || ("/game.html?id=" + encodeURIComponent(g.id));
  return `<a class="card ${esc(g.type)}" href="${href}" role="listitem">
    ${coverHtml(g)}
    <div class="info">
      <h3>${esc(g.name)}</h3>
      <div class="meta">
        <span class="size">${fmtSize(g.size)}</span>
        <span class="play">开始游戏 →</span>
      </div>
    </div>
  </a>`;
}
function render() {
  const grid = document.getElementById("grid");
  const list = GAMES.filter(g => curFilter === "all" || g.type === curFilter);
  if (!list.length) {
    grid.innerHTML = "";
    const st = document.getElementById("state");
    st.style.display = "block";
    st.innerHTML = curFilter === "all" ? "暂无可用的游戏" : `暂无「${curFilter === "flash" ? "Flash 怀旧" : "H5"}」类游戏`;
    return;
  }
  document.getElementById("state").style.display = "none";
  grid.innerHTML = list.map(cardHtml).join("");
}
function load() {
  const grid = document.getElementById("grid");
  grid.innerHTML = Array.from({ length: 4 }, () => `<div class="skeleton" aria-hidden="true"></div>`).join("");
  fetch(API_BASE + "/games")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(games => {
      GAMES = Array.isArray(games) ? games : [];
      render();
      const flash = GAMES.filter(g => g.type === "flash").length;
      const h5 = GAMES.filter(g => g.type === "h5").length;
      document.getElementById("counts").innerHTML =
        `<span class="pill">共 <b>${GAMES.length}</b> 款</span>
         <span class="pill">Flash <b>${flash}</b></span>
         <span class="pill">H5 <b>${h5}</b></span>`;
      document.querySelectorAll(".tab").forEach(b => {
        const f = b.dataset.f;
        const n = f === "all" ? GAMES.length : GAMES.filter(g => g.type === f).length;
        const span = b.querySelector(".n");
        if (span) span.textContent = n;
      });
    })
    .catch(err => {
      grid.innerHTML = "";
      const st = document.getElementById("state");
      st.style.display = "block";
      st.innerHTML = `加载失败，请检查网络后重试。<br><button onclick="load()">重新加载</button>`;
      console.error(err);
    });
}

// 模块切换：游戏中心 / AI 助手
const modBtns = document.querySelectorAll(".mnav[data-v]");
function switchView(v) {
  document.getElementById("view-games").style.display = v === "games" ? "block" : "none";
  document.getElementById("view-ai").style.display = v === "ai" ? "block" : "none";
  modBtns.forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
}
modBtns.forEach(b => b.addEventListener("click", () => switchView(b.dataset.v)));

// 支持 #ai / #games 直达链接（供其他模块页侧边栏跳转）
function applyHash() {
  if (location.hash === "#ai") switchView("ai");
  else if (location.hash === "#games") switchView("games");
  else if (location.hash === "#login") { switchView("games"); openLogin("login"); }
}
window.addEventListener("hashchange", applyHash);
applyHash();

// ===== AI 助手 iframe：传递登录 token（应用用它调用站内 AI 代理/预设 API）=====
const AI_APP_ORIGIN = "https://4m8dv3g0c7b16.doubao.link";
function sendTokenToAiIframe() {
  const f = document.getElementById("aiFrame");
  const t = getToken();
  if (f && f.contentWindow && t) {
    f.contentWindow.postMessage({ type: "ghub-token", token: t }, AI_APP_ORIGIN);
  }
}
const aiIfr = document.getElementById("aiFrame");
if (aiIfr) {
  aiIfr.addEventListener("load", () => sendTokenToAiIframe());
}
window.addEventListener("message", (e) => {
  if (e.origin !== AI_APP_ORIGIN) return;
  if (e.data && e.data.type === "ghub-request-token") {
    sendTokenToAiIframe();
  }
});

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  document.querySelectorAll(".tab").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); });
  b.classList.add("on"); b.setAttribute("aria-selected", "true");
  curFilter = b.dataset.f;
  render();
});
// 键盘方向键切换筛选
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  const keys = ["ArrowLeft", "ArrowRight"];
  if (!keys.includes(e.key)) return;
  const tabs = [...document.querySelectorAll(".tab")];
  const idx = tabs.findIndex(b => b.classList.contains("on"));
  const next = (idx + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
  tabs[next].click(); tabs[next].focus();
});
load();

// ===== 账号系统（登录 / 注册 / 登出）=====
const TOKEN_KEY = "ghub_token";
const USER_KEY = "ghub_user";
function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || "null"); } catch (e) { return null; } }
function saveUser(u) { if (u) localStorage.setItem(USER_KEY, JSON.stringify(u)); else localStorage.removeItem(USER_KEY); }
let authMode = "login";
function updateAuthUI() {
  const u = getUser();
  const loginBtn = document.getElementById("loginBtn");
  const info = document.getElementById("userInfo");
  if (u && u.username) {
    loginBtn.style.display = "none";
    info.style.display = "flex";
    const un = document.getElementById("uname");
    un.textContent = u.username;
    un.style.cursor = "pointer";
    un.title = "账号设置";
    un.onclick = () => { location.href = "/account"; };
    document.getElementById("uadmin").style.display = u.admin ? "inline" : "none";
  } else {
    loginBtn.style.display = "";
    info.style.display = "none";
  }
}
function openLogin(mode) {
  setAuthMode(mode || "login");
  document.getElementById("loginModal").style.display = "flex";
  document.getElementById("authUser").focus();
}
function closeLogin() { document.getElementById("loginModal").style.display = "none"; }
function setAuthMode(m) {
  authMode = m;
  document.getElementById("authTitle").textContent = m === "login" ? "登录" : "注册";
  document.getElementById("authSubmit").textContent = m === "login" ? "登录" : "注册";
  document.getElementById("tabLogin").classList.toggle("on", m === "login");
  document.getElementById("tabReg").classList.toggle("on", m === "register");
  document.getElementById("authErr").textContent = "";
  document.getElementById("authTip").style.display = m === "register" ? "" : "none";
}
async function submitAuth() {
  const u = document.getElementById("authUser").value.trim();
  const p = document.getElementById("authPass").value;
  const err = document.getElementById("authErr");
  err.textContent = "";
  if (!u || !p) { err.textContent = "请填写用户名和密码"; return; }
  const btn = document.getElementById("authSubmit");
  btn.disabled = true;
  const label = authMode === "login" ? "登录" : "注册";
  btn.textContent = "请稍候…";
  try {
    const res = await fetch("/api/auth/" + (authMode === "login" ? "login" : "register"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await res.json();
    if (!res.ok) {
      err.textContent = d.error || "操作失败";
      btn.disabled = false; btn.textContent = label; return;
    }
    if (authMode === "register") {
      // 注册成功 → 自动登录
      const res2 = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const d2 = await res2.json();
      if (d2.ok) {
        localStorage.setItem(TOKEN_KEY, d2.token);
        saveUser({ username: d2.username, admin: d2.admin });
      }
      if (d.admin) alert("注册成功！你是第一个注册的账号，已自动成为管理员。");
      else alert("注册成功！");
    } else {
      localStorage.setItem(TOKEN_KEY, d.token);
      saveUser({ username: d.username, admin: d.admin });
    }
    closeLogin();
    updateAuthUI();
  } catch (e) {
    err.textContent = "网络错误：" + e.message;
  }
  btn.disabled = false; btn.textContent = label;
}
function doLogout() {
  const t = getToken();
  if (t) fetch("/api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + t } }).catch(() => { });
  localStorage.removeItem(TOKEN_KEY);
  saveUser(null);
  updateAuthUI();
  location.href = "/login.html";
}
document.getElementById("loginBtn").addEventListener("click", () => openLogin("login"));
document.getElementById("logoutBtn").addEventListener("click", doLogout);
document.getElementById("authSubmit").addEventListener("click", submitAuth);
document.getElementById("authPass").addEventListener("keydown", e => { if (e.key === "Enter") submitAuth(); });
updateAuthUI();
</script>
